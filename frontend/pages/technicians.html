<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnicos - Sistema de Manutenção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <aside class="sidebar col-md-3 col-lg-2 bg-dark text-white p-3">
                <h4 class="mb-4">Manutenção</h4>
                <p id="userInfo" class="small text-break"></p>
                <nav class="nav flex-column">
                    <a class="nav-link text-white" href="./dashboard.html">Dashboard / Equipamentos</a>
                    <a class="nav-link text-white" href="./categories.html">Categorias</a>
                    <a class="nav-link text-white" href="./locations.html">Locais</a>
                    <a class="nav-link text-white active" href="./technicians.html">Técnicos</a>
                    <a class="nav-link text-white" href="./service-orders.html">Ordens de Serviço</a>
                </nav>
                <button id="logoutButton" type="button" class="btn btn-outline-danger mt-3">Sair</button>
            </aside>

            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                    <h1 class="h3 mb-0">Técnicos</h1>
                    <button id="newTechnicianButton" type="button" class="btn btn-primary admin-only">Novo Técnico</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle bg-white">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Telefone</th>
                                <th>E-mail</th>
                                <th>Especialidade</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="techniciansTable"></tbody>
                    </table>
                </div>
                <p id="emptyMessage" class="text-muted d-none">Nenhum técnico cadastrado.</p>
            </main>
        </div>
    </div>

    <div class="modal fade" id="technicianModal" tabindex="-1" aria-labelledby="technicianModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="technicianModalTitle">Novo Técnico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="technicianName" class="form-label">Nome</label>
                        <input id="technicianName" class="form-control" type="text">
                    </div>
                    <div class="mb-3">
                        <label for="technicianPhone" class="form-label">Telefone</label>
                        <input id="technicianPhone" class="form-control" type="tel" placeholder="(11) 99999-9999">
                    </div>
                    <div class="mb-3">
                        <label for="technicianEmail" class="form-label">E-mail</label>
                        <input id="technicianEmail" class="form-control" type="email">
                    </div>
                    <div class="mb-3">
                        <label for="technicianSpecialty" class="form-label">Especialidade</label>
                        <input id="technicianSpecialty" class="form-control" type="text" placeholder="Ex.: Elétrica, Mecânica">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="saveTechnicianButton" class="btn btn-success">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted small py-3">
        <p class="mb-0">2026 Sistema de Controle de Manutenção de Equipamentos - ADS 2026-2</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../js/technicians.js"></script>
</body>
</html>
